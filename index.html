<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Personal Document Vault">

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">

  <title>Personal Document Vault</title>

  <style>
    :root {
      --header-height: 44px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
      font-family: Arial, sans-serif;
    }

    #pwaShellHeader {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 12px;
      border-bottom: 1px solid #e0e0e0;
      background: #ffffff;
      color: #202124;
      font-size: 14px;
      font-weight: 600;
    }

    #vaultFrame {
      display: block;
      width: 100%;
      height: calc(100% - var(--header-height));
      border: 0;
      margin: 0;
      padding: 0;
      background: #ffffff;
    }

    @media (display-mode: standalone) {
      #pwaShellHeader {
        padding-top: env(safe-area-inset-top, 0px);
        height: calc(var(--header-height) + env(safe-area-inset-top, 0px));
      }

      #vaultFrame {
        height: calc(
          100% - var(--header-height) - env(safe-area-inset-top, 0px)
        );
      }
    }
  </style>
</head>

<body>
  <!--
    B2.4 External PWA Shell POC
    STAGING ONLY.

    Replace the placeholder below with the STAGING Apps Script Web App /exec URL.
    Do NOT use the production URL.
  -->
  <div id="pwaShellHeader">Personal Document Vault — PWA POC</div>

  <iframe
    id="vaultFrame"
    src="https://script.google.com/macros/s/AKfycbzT-966tDJXK7XxdfcXVZqw8ALo2BFtdGee295At_0/dev"
    title="Personal Document Vault"
    allow="clipboard-read; clipboard-write">
  </iframe>
</body>
</html>
