<script>
  const CLIENT_ID = '877844953999-calltjdsasf3psnvs5pob15a5l5ei761.apps.googleusercontent.com';

  const SCRIPT_ID =
    '1s9mFCnwN86qFLlWVeD0bxSx3DEIAd8ehudASbHOkLI1HU3H4IdTy4skc';

  const DEPLOYMENT_ID =
    'AKfycbzbwAj0qpPcHfpOnRAf4VDS6UUo4y8GtZibbo_zcxE06JnbKe9KC85mDAtJxQhmRDNf';

  const SCOPES = [
    'https://www.googleapis.com/auth/drive',
    'https://www.googleapis.com/auth/spreadsheets',
    'https://www.googleapis.com/auth/userinfo.email'
  ].join(' ');

  let tokenClient;
  let accessToken = null;

  window.onload = function () {
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: CLIENT_ID,
      scope: SCOPES,
      callback: function (response) {
        if (response.error) {
          document.getElementById('output').textContent =
            JSON.stringify(response, null, 2);
          return;
        }

        accessToken = response.access_token;
        runIdentityTest();
      }
    });
  };

  function authorize() {
    tokenClient.requestAccessToken();
  }

  async function runIdentityTest() {
    const output = document.getElementById('output');

    output.textContent = 'Calling Apps Script API...';

    try {
      const response = await fetch(
        'https://script.googleapis.com/v1/scripts/' +
        SCRIPT_ID +
        ':run',
        {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + accessToken,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            function: 'pwaApiIdentityTest',
            parameters: [],
            devMode: false
          })
        }
      );

      const data = await response.json();

      output.textContent = JSON.stringify(data, null, 2);

    } catch (error) {
      output.textContent =
        'ERROR:\n' + error.message;
    }
  }
</script>
